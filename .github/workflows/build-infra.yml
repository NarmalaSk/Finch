name: Spin Gke Clusters

on:
 workflow_dispatch:

jobs:
  Create:
    permissions:
      id-token: write
      contents: read

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: 'google-github-actions/auth@v3'
        with:
              service_account: 'my-service-account@forward-garden-444210-d7.iam.gserviceaccount.com' 
              workload_identity_provider: 'projects/341213114487/locations/global/workloadIdentityPools/githubactions/providers/my-repo'

      - name: Create Dev & Prod Cluster
        run:  | 
            gcloud container clusters create prod-cluster   --zone=us-central1-a   --num-nodes=2   --machine-type=e2-medium   --disk-size=40GB   --enable-autoupgrade   --enable-autorepair
            gcloud container clusters create dev-cluster   --zone=us-central1-a   --num-nodes=1   --machine-type=e2-small   --disk-size=20GB   --enable-autoupgrade   --enable-autorepair
