name: Deploy API to Dev GKE

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:       # ← REQUIRED FOR OIDC
      id-token: write  # ← allows GitHub to mint OIDC token
      contents: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - id: 'auth'
      uses: 'google-github-actions/auth@v2'
      with:
        workload_identity_provider: 'projects/341213114487/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'github-deployer@forward-garden-444210-d7.iam.gserviceaccount.com'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v3'
      with:
        version: '>= 363.0.0'

    - name: 'Use gcloud CLI'
      run: gcloud info
