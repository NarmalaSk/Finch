name: Deploy API to Dev GKE

on:
  push:
    branches:
      - main

jobs:
  build:
    # Allow the job to fetch a GitHub ID token
    permissions:
      id-token: write
      contents: read

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v1'
        with:
          create_credentials_file: true
          workload_identity_provider: 'projects/forward-garden-444210-d7/locations/global/workloadIdentityPools/github/providers/github'
          service_account: 'githubactions@forward-garden-444210-d7.iam.gserviceaccount.com'
    
      - name: chcek gcloud
        run: | 
              gcloud auth print-access-token \
                --impersonate-service-account=githubactions@forward-garden-444210-d7.iam.gserviceaccount.com

                   gsutil -i githubactions@forward-garden-444210-d7.iam.gserviceaccount.com ls gs://my-ml-dataset/

