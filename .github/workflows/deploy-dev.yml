name: Deploy API to Dev GKE

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    # Authenticate to GCP using Workload Identity Federation
    - id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: "projects/341213114487/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
        service_account: "github-deployer@forward-garden-444210-d7.iam.gserviceaccount.com"

    # Install gcloud CLI
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
      with:
        version: ">= 363.0.0"

    # Authenticate kubectl to your dev cluster
    - name: Get GKE Credentials
      run: |
        gcloud container clusters get-credentials dev-cluster \
          --region us-central1 \
          --project forward-garden-444210-d7

    # Build & push Docker image
    - name: Build & Push Docker Image
      run: |
        IMAGE="us-central1-docker.pkg.dev/forward-garden-444210-d7/api-dev-repo/api:$(date +%s)"
        echo "IMAGE=$IMAGE" >> $GITHUB_ENV

        gcloud builds submit --tag $IMAGE .

    # Deploy to GKE
    - name: Deploy to Dev Cluster
      run: |
        kubectl set image deployment/api-deployment api-container=$IMAGE
        kubectl rollout status deployment/api-deployment
